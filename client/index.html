<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Smart To-Do List application"
    >

    <title>Smart To-Do List</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="app-header">
        <div class="container header-content">
            <div>
                <p class="eyebrow">Productivity Dashboard</p>
                <h1>Smart To-Do List</h1>
                <p class="subtitle">
                    Organize your tasks and stay focused.
                </p>
            </div>

            <button
                id="add-task-button"
                class="primary-button"
                type="button"
            >
                + Add Task
            </button>
        </div>
    </header>

    <main class="container">
        <section
            class="task-controls"
            aria-label="Task controls"
        >
            <div class="search-group">
                <label for="search-input">Search tasks</label>

                <input
                    id="search-input"
                    type="search"
                    placeholder="Search by title or description"
                >
            </div>

            <div class="filter-group">
                <label for="status-filter">Status</label>

                <select id="status-filter">
                    <option value="">All statuses</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="priority-filter">Priority</label>

                <select id="priority-filter">
                    <option value="">All priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sort-select">Sort</label>

                <select id="sort-select">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="deadline">Deadline</option>
                    <option value="priority">Priority</option>
                </select>
            </div>

            <div class="filter-actions">
                <span class="filter-label">Actions</span>

                <button
                    id="reset-filters-button"
                    class="secondary-button"
                    type="button"
                >
                    Reset filters
                </button>
            </div>

        </section>

        <section
            class="task-section"
            aria-labelledby="task-section-title"
        >
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Your workload</p>
                    <h2 id="task-section-title">Tasks</h2>
                </div>

                <p id="task-count" class="task-count">
                    0 tasks
                </p>
            </div>

            <div
                id="status-message"
                class="status-message"
                role="status"
            >
                Loading tasks...
            </div>

            <div
                id="task-list"
                class="task-list"
                aria-live="polite"
            ></div>
        </section>

        <div
            id="task-modal"
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="task-modal-title"
            hidden
        >
            <div class="modal-backdrop" data-modal-close></div>

            <div class="modal-panel">
                <div class="modal-header">
                    <div>
                        <p class="eyebrow">New task</p>
                        <h2 id="task-modal-title">Add Task</h2>
                    </div>

                    <button
                        id="close-modal-button"
                        class="icon-button"
                        type="button"
                        aria-label="Close modal"
                    >
                        ✕
                    </button>
                </div>

                <form id="task-form" novalidate>
                    <div class="form-group">
                        <label for="task-title">
                            Title
                            <span aria-hidden="true">*</span>
                        </label>

                        <input
                            id="task-title"
                            name="title"
                            type="text"
                            maxlength="100"
                            autocomplete="off"
                            required
                        >

                        <p
                            id="title-error"
                            class="field-error"
                            role="alert"
                        ></p>
                    </div>

                    <div class="form-group">
                        <label for="task-description">
                            Description
                        </label>

                        <textarea
                            id="task-description"
                            name="description"
                            rows="4"
                            placeholder="Add more details about this task"
                        ></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-priority">
                                Priority
                            </label>

                            <select
                                id="task-priority"
                                name="priority"
                            >
                                <option value="Low">Low</option>
                                <option value="Medium" selected>
                                    Medium
                                </option>
                                <option value="High">High</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="task-deadline">
                                Deadline
                            </label>

                            <input
                                id="task-deadline"
                                name="deadline"
                                type="date"
                            >
                        </div>
                    </div>

                    <p
                        id="form-error"
                        class="form-error"
                        role="alert"
                        hidden
                    ></p>

                    <div class="modal-actions">
                        <button
                            id="cancel-task-button"
                            class="secondary-button"
                            type="button"
                        >
                            Cancel
                        </button>

                        <button
                            id="submit-task-button"
                            class="primary-button"
                            type="submit"
                        >
                            Add Task
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <script
        src="./js/api.js"
        type="module"
    ></script>

    <script
        src="./js/ui.js"
        type="module"
    ></script>

    <script
        src="./js/app.js"
        type="module"
    ></script>
</body>
</html>
